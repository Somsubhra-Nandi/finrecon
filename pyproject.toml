[project]
name = "finrecon"
version = "0.0.1"
description = "FinRecon — deterministic reconciliation controller with a bounded AI investigation agent (Razorpay AI Buildathon Track 04)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
